[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggriculture-route-rl"
version = "0.5.0"
description = "Independent Rust mixed-production RL; Python evaluation client only"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
route-rl-evaluate = "route_rl.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
